<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apply Through RAMBHAU</title>

  <meta
    name="description"
    content="Apply for jobs through RAMBHAU recruitment platform."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <nav class="navbar">

    <a href="index.html" class="logo">
      RAM<span>BHAU</span>
    </a>

    <button class="menu-toggle" type="button">☰</button>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="jobs.html">Jobs</a></li>
      <li><a href="index.html#categories">Categories</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>

    <select class="language-select">
      <option value="en">English</option>
      <option value="mr">मराठी</option>
      <option value="hi">हिंदी</option>
    </select>

  </nav>
</header>

<main>

<section>

  <div class="container">

    <div class="section-title">
      <h2>Apply Through RAMBHAU</h2>
      <p id="selectedJob">
        Submit your details and our recruitment team will contact you.
      </p>
    </div>

    <div
      class="admin-box"
      style="max-width:800px;margin:auto;"
    >

      <form id="applicationForm">

        <div class="form-group">
          <label>Full Name *</label>

          <input
            type="text"
            id="fullName"
            required
            maxlength="100"
            placeholder="Enter your full name"
          >
        </div>


        <div class="detail-grid">

          <div class="form-group">
            <label>Mobile Number *</label>

            <input
              type="tel"
              id="mobile"
              required
              maxlength="15"
              placeholder="10 digit mobile number"
            >
          </div>


          <div class="form-group">
            <label>Email</label>

            <input
              type="email"
              id="email"
              maxlength="150"
              placeholder="Enter email address"
            >
          </div>


          <div class="form-group">
            <label>Current City *</label>

            <input
              type="text"
              id="currentCity"
              required
              maxlength="100"
              placeholder="Example: Kalyan"
            >
          </div>


          <div class="form-group">
            <label>Age *</label>

            <input
              type="number"
              id="age"
              required
              min="18"
              max="70"
              placeholder="Your age"
            >
          </div>


          <div class="form-group">
            <label>Education</label>

            <input
              type="text"
              id="education"
              maxlength="150"
              placeholder="Example: 12th Pass"
            >
          </div>


          <div class="form-group">
            <label>Experience</label>

            <input
              type="text"
              id="experience"
              maxlength="150"
              placeholder="Example: Fresher / 2 Years"
            >
          </div>

        </div>


        <div class="form-group">
          <label>Resume URL</label>

          <input
            type="url"
            id="resumeUrl"
            maxlength="500"
            placeholder="Google Drive / Resume link (optional)"
          >
        </div>


        <div class="form-group">
          <label>Message / Preferred Shift</label>

          <textarea
            id="message"
            maxlength="1000"
            placeholder="Tell us about your preferred shift or anything else..."
          ></textarea>
        </div>


        <button
          type="submit"
          class="btn btn-primary"
        >
          Submit Application
        </button>

        <div
          id="applicationMessage"
          style="display:none;"
        ></div>

      </form>

    </div>

  </div>

</section>

</main>


<footer>

  <div class="footer-grid">

    <div>
      <div class="footer-logo">
        RAM<span>BHAU</span>
      </div>

      <p>
        Jobs • Careers • Recruitment
      </p>
    </div>

    <div>
      <div class="footer-title">Quick Links</div>

      <ul class="footer-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="jobs.html">Jobs</a></li>
      </ul>
    </div>

    <div>
      <div class="footer-title">RAMBHAU</div>

      <p>
        Maharashtra Recruitment Platform
      </p>
    </div>

  </div>

  <div class="footer-bottom">
    © 2026 RAMBHAU. All Rights Reserved.
  </div>

</footer>


<script src="script.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

  const form =
    document.getElementById("applicationForm");

  const messageBox =
    document.getElementById("applicationMessage");

  const selectedJob =
    document.getElementById("selectedJob");

  const params =
    new URLSearchParams(window.location.search);

  const slug =
    params.get("job");


  if (!slug) {

    selectedJob.textContent =
      "Please select a job before applying.";

    return;

  }


  let job = null;


  try {

    const response =
      await fetch(
        "/api/jobs/" +
        encodeURIComponent(slug)
      );

    if (response.ok) {

      job =
        await response.json();

      selectedJob.textContent =
        "Applying for: " +
        job.title +
        " — " +
        job.company;

    }

  } catch (error) {

    console.log(error);

  }


  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const data = {

        job_slug: slug,

        full_name:
          document
            .getElementById("fullName")
            .value
            .trim(),

        mobile:
          document
            .getElementById("mobile")
            .value
            .trim(),

        email:
          document
            .getElementById("email")
            .value
            .trim(),

        current_city:
          document
            .getElementById("currentCity")
            .value
            .trim(),

        age:
          Number(
            document
              .getElementById("age")
              .value
          ),

        education:
          document
            .getElementById("education")
            .value
            .trim(),

        experience:
          document
            .getElementById("experience")
            .value
            .trim(),

        resume_url:
          document
            .getElementById("resumeUrl")
            .value
            .trim(),

        message:
          document
            .getElementById("message")
            .value
            .trim()

      };


      try {

        const response =
          await fetch(
            "/api/applications",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(data)

            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "Unable to submit application."
          );

        }


        messageBox.style.display =
          "block";

        messageBox.className =
          "success-message";

        messageBox.textContent =
          "Application submitted successfully. RAMBHAU team will contact you.";


        form.reset();


      } catch (error) {

        messageBox.style.display =
          "block";

        messageBox.className =
          "error-message";

        messageBox.textContent =
          error.message;

      }

    }
  );

});

</script>

</body>
</html>
